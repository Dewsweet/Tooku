services:
  tooku:
    build:
      context: .
    image: tooku:local
    init: true
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "${TOOKU_BIND_ADDRESS:-127.0.0.1}:${TOOKU_HTTP_PORT:-8080}:8080"
    environment:
      NAVIDROME_UPSTREAM: "${NAVIDROME_UPSTREAM:-http://host.docker.internal:44533}"
      TOOKU_SECRET_KEY_FILE: /run/tooku-secret/tooku-secret.key
      TOOKU_TRUST_PROXY: "${TOOKU_TRUST_PROXY:-false}"
      TOOKU_COOKIE_SECURE: "${TOOKU_COOKIE_SECURE:-false}"
      TOOKU_HSTS: "${TOOKU_HSTS:-false}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - tooku-data:/data
      - tooku-security-key:/run/tooku-secret
    restart: unless-stopped
    stop_grace_period: 20s
volumes:
  tooku-data:
  tooku-security-key:
