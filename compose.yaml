services:
  tooku:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NAVIDROME_UPSTREAM: http://host.docker.internal:44533
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - tooku-data:/data
    restart: unless-stopped
volumes:
  tooku-data:
