services:
  tooku:
    image: dewsweet/tooku:v0.1.0
    container_name: tooku
    restart: unless-stopped
    ports:
      - "18733:8080"
    environment:
      NAVIDROME_UPSTREAM: http://192.168.1.10:4533
      TOOKU_SECRET_KEY_FILE: /run/tooku-secret/tooku-secret.key
    volumes:
      - ./data:/data
      - ./secret:/run/tooku-secret
