name: Publish Docker image

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Check, build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME }}
    steps:
      - name: Check out the released commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Validate release version and image configuration
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const { RELEASE_TAG: tag, DOCKERHUB_USERNAME: username, DOCKERHUB_NAMESPACE: namespace } = process.env;
          const versionTag = /^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$/;
          if (!tag || tag !== `v${version}` || !versionTag.test(tag) || tag.length > 128) {
            throw new Error('The release tag must be v<package.json version>, for example v0.1.0.');
          }
          const account = /^[a-z0-9][a-z0-9_-]*$/;
          if (!username || !namespace || !account.test(username) || !account.test(namespace)) {
            throw new Error('Configure DOCKERHUB_USERNAME and DOCKERHUB_NAMESPACE as GitHub Actions variables.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `image=docker.io/${namespace}/tooku:${tag}\n`);
          NODE

      - name: Install locked dependencies
        run: npx --yes pnpm@11.25.0 install --frozen-lockfile

      - name: Check source and public smoke tests
        run: |
          npm run lint
          npm test
          npm run security:licenses
          npm run container:check

      - name: Audit locked dependencies
        run: npm run security:audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the image for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ steps.release.outputs.image }}
          labels: |
            org.opencontainers.image.title=Tooku
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.licenses=MIT

      - name: Check container startup and health
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          trap 'docker rm --force --volumes tooku-release-check >/dev/null 2>&1 || true' EXIT
          docker run --detach --name tooku-release-check \
            --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 128 --memory 512m --cpus 1 "$IMAGE"
          for attempt in $(seq 1 20); do
            if docker exec tooku-release-check node scripts/container-healthcheck.mjs; then
              exit 0
            fi
            sleep 2
          done
          docker logs tooku-release-check
          exit 1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the verified version image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: docker push "$IMAGE"

      - name: Record published image and digest
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          printf '## Published image\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
